name: CipherVeil CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Java + C++)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners already ship a full Android SDK under
      # $ANDROID_HOME. We deliberately do NOT use android-actions/setup-android@v3
      # here: it tries to install the long-removed legacy "tools" package
      # and fails the whole job. Using the preinstalled SDK + sdkmanager
      # directly avoids that entirely.
      - name: Put Android SDK tools on PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install build-tools, platform, NDK + CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # Pinned to match the AGP version in build.gradle (AGP 8.5.x needs
      # Gradle 8.7). Leaving this unpinned lets setup-gradle grab whatever
      # is newest (it previously pulled Gradle 9.8.1), which AGP does not
      # support and fails tasks like dataBindingMergeDependencyArtifactsDebug.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherVeil-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  verify-protection-engine:
    name: Sanity-check Python protection engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Byte-compile protector.py
        run: python -m py_compile tools/protector.py
